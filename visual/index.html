<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생각 씨앗 시각화 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f0e6; --card:#fffdf8; --ink:#2f2a24; --muted:#7d7266; --line:#ece2d2;
  --g:#5b7342; --g2:#8fb069; --gl:#e8efdc; --o:#d9774a; --ol:#fbe7dc; --y:#fdf3d4; --b:#e6eff7; --p:#fbe9ef; --v:#efeaf8;
  --shadow:0 2px 0 rgba(80,60,30,.05), 0 8px 24px rgba(80,60,30,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e1c18; --card:#2a2721; --ink:#f1ebe0; --muted:#b4a999; --line:#3d3830;
    --g:#a9c98a; --g2:#7f9d5e; --gl:#323a28; --o:#f0956a; --ol:#40302a; --y:#3b3523; --b:#26313b; --p:#3b2a30; --v:#2f2b3a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1e1c18; --card:#2a2721; --ink:#f1ebe0; --muted:#b4a999; --line:#3d3830;
  --g:#a9c98a; --g2:#7f9d5e; --gl:#323a28; --o:#f0956a; --ol:#40302a; --y:#3b3523; --b:#26313b; --p:#3b2a30; --v:#2f2b3a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.jua{font-family:'Jua',system-ui,sans-serif;font-weight:400;letter-spacing:-.01em}
.hand{font-family:'Gaegu',cursive;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--g2);border-color:transparent}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Jua';font-size:19px;color:var(--g);background:none;border:0;padding:0}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
main{max-width:820px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;background:var(--g);color:#fff;font-family:'Jua';font-size:17px;min-height:46px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{background:#5e7f3d}}
.btn.ghost{background:var(--gl);color:var(--g)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.warm{background:var(--o)}
.btn.sm{padding:7px 14px;min-height:36px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:13px;background:var(--gl);color:var(--g);font-weight:700}
.pill.o{background:var(--ol);color:var(--o)}
.hl-g{color:var(--g)} .hl-o{color:var(--o)}
.under{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--g2) 40%,transparent) 0)}
.hidden{display:none!important}
/* fractions */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.82em;margin:0 2px}
.fr i{font-style:normal;padding:0 2px}
.fr i:first-child{border-bottom:1.5px solid currentColor}
/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero h1{font-size:30px;line-height:1.3;margin:6px 0 10px}
.hero .plant{width:120px}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.stu{border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.stu b{font-family:'Jua';font-size:19px;font-weight:400}
.stu.add{align-items:center;justify-content:center;border-style:dashed;color:var(--g)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 0;font-family:'Jua';font-size:18px}
.grades button.on{background:var(--g);border-color:var(--g);color:#fff}
.steps6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.steps6 div{border-radius:14px;padding:10px;font-size:14px;line-height:1.35}
.steps6 b{display:block;font-family:'Jua';font-weight:400;font-size:15px}
.s1{background:var(--y)}.s2{background:var(--b)}.s3{background:var(--p)}.s4{background:var(--gl)}.s5{background:var(--v)}.s6{background:var(--gl)}
/* dashboard */
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.today .plant{width:110px}
.cal{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;align-items:center;margin-top:10px}
.cal .wk{font-size:13px;color:var(--muted);padding-right:4px;white-space:nowrap}
.day{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);padding:0;gap:0}
.day .n{font-family:'Jua';font-size:15px;color:var(--ink)}
.day .ic{font-size:18px;line-height:1.1}
.day.done{background:var(--gl);border-color:var(--g2)}
.day.half{background:var(--y)}
.day.now{border:2.5px solid var(--o);background:var(--ol)}
.day.lock{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-family:'Jua';font-weight:400;font-size:22px;color:var(--g)}
.stat span{font-size:12px;color:var(--muted)}
/* solve */
.stepper{display:flex;gap:4px;margin:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.stepper button{flex:1;min-width:64px;border:0;background:transparent;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.stepper .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-family:'Jua';font-size:14px;color:var(--muted)}
.stepper button.on{color:var(--ink)}
.stepper button.on .dot{background:var(--o);color:#fff}
.stepper button.ok .dot{background:var(--g2);color:#fff}
.stepper button:disabled{cursor:default}
.ptext{font-size:19px;line-height:1.85;word-break:keep-all}
.tok{border-radius:6px;padding:1px 1px;cursor:pointer;transition:background .15s}
.tok.k{background:#fff0a8;color:#2f2a24}
.tok.f{background:#ffc9da;color:#2f2a24}
.markers{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.markers button{border:2px solid transparent;border-radius:999px;padding:6px 12px;font-size:14px;background:var(--card);border-color:var(--line)}
.markers button.on{border-color:var(--ink)}
.mk-k{background:#fff0a8!important;color:#2f2a24}
.mk-f{background:#ffc9da!important;color:#2f2a24}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.timer{display:flex;align-items:center;gap:10px;background:var(--b);border-radius:16px;padding:10px 14px}
.timer .bar{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.timer .bar i{display:block;height:100%;background:#7fa7c9;border-radius:99px;transition:width 1s linear}
.timer b{font-family:'Jua';font-weight:400;font-size:20px;min-width:58px;text-align:right}
.pad{position:relative;width:100%;aspect-ratio:10/7;border-radius:16px;overflow:hidden;border:1.5px solid var(--line);background:#fff;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tools button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-width:42px;height:42px;padding:0 10px;font-size:14px}
.tools button.on{border-color:var(--g);background:var(--gl);color:var(--g)}
.tools .sw{width:30px;height:30px;min-width:0;padding:0;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.tools .sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.tools .sep{width:1px;height:28px;background:var(--line);margin:0 2px}
.tpls{display:flex;gap:6px;flex-wrap:wrap}
.tpls button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px}
.tpls button.on{background:var(--g);color:#fff;border-color:var(--g)}
.hint{background:var(--y);border-radius:16px;padding:12px 14px;margin-top:10px}
.photo{margin-top:10px;position:relative}
.photo img{max-width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ansrow label{display:flex;align-items:center;gap:6px}
.ansrow input{width:110px;font-size:20px;text-align:center;font-family:'Jua'}
.feedback{border-radius:16px;padding:12px 14px;margin-top:12px}
.feedback.ok{background:var(--gl)}
.feedback.no{background:var(--ol)}
.mini{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:15px}
.model .stp{border-left:4px solid var(--g2);padding:4px 0 4px 14px;margin:14px 0}
.model .stp h3{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:8px}
.model .stp h3 .num{width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:14px}
.model ul{margin:4px 0;padding-left:20px}
.eq{font-size:18px;line-height:1.9}
.ans-badge{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--g);border-radius:12px;padding:4px 14px;font-family:'Jua';font-size:19px;color:var(--g)}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--gl);border-radius:18px;padding:12px 14px;margin-top:12px}
.tip .hand{font-size:20px;line-height:1.35}
.vz{width:100%;height:auto;display:block;margin:6px 0;font-family:'Gowun Dodum',sans-serif}
.vz .vt{fill:var(--ink)}
.vz .vt.vo{fill:var(--o)} .vz .vt.vg{fill:var(--g)}
.vz .vs{stroke:var(--ink)} .vz .vfill{fill:var(--ink)}
.vz .vbox{stroke:var(--ink);stroke-width:1.4}
.vz .vq{stroke:var(--o);stroke-width:2;stroke-dasharray:5 4}
.vz .vgrp{fill:var(--card);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.vz .vhead{fill:var(--gl);stroke:var(--muted)} .vz .vcell{fill:var(--card);stroke:var(--muted)} .vz .vhl{fill:#fff3b8;stroke:var(--muted)}
:root[data-theme="dark"] .vz .vhl{fill:#5a5130}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vz .vhl{fill:#5a5130}}
.vz .vcellb{fill:none;stroke:var(--muted);stroke-width:1.2}
.vz .vgc{stroke:var(--muted);stroke-width:1.2}
.vz rect[fill="#f6efe0"]{fill:var(--bg)}
.vcap{font-size:14px;color:var(--muted);margin-top:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.checks label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.checks input{width:22px;height:22px;accent-color:var(--g)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:100px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 6px;font-size:15px}
.seg button.on{background:var(--g);color:#fff;border-color:var(--g)}
.cardimg{width:100%;border-radius:16px;border:1px solid var(--line)}
/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(30,25,15,.45);display:grid;place-items:center;padding:16px}
.ov .card{max-width:420px;width:100%;text-align:center}
.stamp{font-family:'Jua';font-size:28px;color:var(--g);margin:6px 0}
@keyframes grow{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.grow{animation:grow .6s cubic-bezier(.3,1.6,.6,1)}
/* teacher */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th,.tb td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.tb th{color:var(--muted);font-weight:400}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist details{border:1px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--card);margin-top:8px}
.plist summary{cursor:pointer;font-weight:700}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:60;font-size:15px;max-width:calc(100% - 32px)}
#printArea{display:none}
@media (max-width:560px){
  .hero{grid-template-columns:1fr}.hero .plant{display:none}
  .hero h1{font-size:25px}
  .steps6{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cmp{grid-template-columns:1fr}
  .today{grid-template-columns:1fr}.today .plant{width:90px;margin:0 auto}
  .ptext{font-size:17.5px}
  .card{padding:16px}
}
@media print{
  body{background:#fff}
  .top,main,.toast,.ov{display:none!important}
  #printArea{display:block}
  .psheet{page-break-after:always;padding:8mm 4mm;font-size:13pt}
  .pprob{border:1px solid #bbb;border-radius:10px;padding:10px 14px;margin-bottom:10px;page-break-inside:avoid}
  .pbox{height:70mm;border:1.5px dashed #aaa;border-radius:8px;margin:8px 0;position:relative}
  .pbox span{position:absolute;left:8px;top:4px;color:#999;font-size:10pt}
  .pline{border-bottom:1px solid #999;height:9mm}
  .vz .vt{fill:#222}.vz .vs{stroke:#222}.vz .vfill{fill:#222}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" id="brandBtn" aria-label="처음으로"><span id="brandIcon"></span><span id="brandName">시각화 챌린지</span></button>
  <span class="sp"></span>
  <span id="whoChip"></span>
  <button class="chip" id="teacherBtn" title="선생님 메뉴">👩‍🏫 선생님</button>
</div></header>
<main id="app"></main>
<div id="printArea"></div>

<script src="problems.js"></script>
<script src="viz.js"></script>
<script>
'use strict';
/* ================= 저장소 ================= */
const KEY = 'vizChallenge.v1';
const DEFAULTS = { students: [], current: null, pin: '0000', daily: true, academy: '생각 씨앗 수학' };
let DB;
try { DB = Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { DB = { ...DEFAULTS }; }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast('저장 공간이 부족해요. 선생님 메뉴에서 백업 후 정리해 주세요.'); }
}
// 그림·사진은 용량이 커서 IndexedDB에 저장
const IMG = (() => {
  let dbp = null, mem = new Map();
  const open = () => dbp || (dbp = new Promise(res => {
    try {
      const r = indexedDB.open('vizChallengeImg', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('img');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    if (!db) return fn(null);
    return new Promise(res => {
      const t = db.transaction('img', mode), st = t.objectStore('img');
      const r = fn(st);
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => res(undefined);
    });
  };
  return {
    get: k => tx('readonly', st => st ? st.get(k) : { result: mem.get(k) }),
    set: (k, v) => tx('readwrite', st => st ? st.put(v, k) : mem.set(k, v)),
    del: k => tx('readwrite', st => st ? st.delete(k) : mem.delete(k)),
    keys: () => tx('readonly', st => st ? st.getAllKeys() : { result: [...mem.keys()] }),
  };
})();

/* ================= 도우미 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const frac = s => esc(s)
  .replace(/(\d+) (\d+)\/(\d+)/g, '$1<span class="fr"><i>$2</i><i>$3</i></span>')
  .replace(/(\d+)\/(\d+)/g, '<span class="fr"><i>$1</i><i>$2</i></span>');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = s => s ? s.slice(5).replace('-', '/') : '';
const uid = () => Math.random().toString(36).slice(2, 9);
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
const student = () => DB.students.find(s => s.id === DB.current);
const probs = g => PROBLEMS[g] || [];
const pid = (g, i) => `${g}-${i}`;
const weekOf = i => Math.floor(i / 5) + 1;

function parseNum(s) {
  s = String(s ?? '').replace(/,/g, '').replace(/\s+/g, ' ').trim();
  if (!s) return NaN;
  let m;
  if ((m = s.match(/^(\d+)\s*(?:와|과|\s)\s*(\d+)\s*분의\s*(\d+)$/))) return +m[1] + +m[3] / +m[2];
  if ((m = s.match(/^(\d+)\s*분의\s*(\d+)$/))) return +m[2] / +m[1];
  if ((m = s.match(/^(\d+)\s*(?:와|과|\s)\s*(\d+)\s*\/\s*(\d+)$/))) return +m[1] + +m[2] / +m[3];
  if ((m = s.match(/^(\d+)\s*\/\s*(\d+)$/))) return +m[1] / +m[2];
  if (/^-?\d*\.?\d+$/.test(s)) return +s;
  return NaN;
}
const isFracAns = v => typeof v === 'string' && v.includes('/');

/* 새싹 그림 (단계 0~4) */
function plant(stage, size = 120) {
  stage = Math.max(0, Math.min(4, stage));
  const L = (x, y, r, rot, c = '#8fb069') => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .5}" transform="rotate(${rot} ${x} ${y})" fill="${c}" stroke="#5b7342" stroke-width="1.5"/>`;
  const stemTop = [92, 76, 62, 46, 40][stage];
  let s = `<path d="M30 98 h60 l-7 22 h-46 z" fill="#d79a6c" stroke="#a8693f" stroke-width="1.5"/><rect x="26" y="92" width="68" height="9" rx="4" fill="#e2ad80" stroke="#a8693f" stroke-width="1.5"/>`;
  if (stage === 0) s += `<ellipse cx="60" cy="90" rx="9" ry="6" fill="#a8743f"/><path d="M60 85 q2 -6 6 -7" stroke="#8fb069" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  else {
    s += `<path d="M60 92 C60 ${stemTop + 20} 60 ${stemTop + 10} 60 ${stemTop}" stroke="#6d8c4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
    if (stage === 1) s += L(50, stemTop + 2, 11, -30) + L(70, stemTop + 2, 11, 30);
    if (stage >= 2) s += L(47, stemTop + 22, 11, -25) + L(73, stemTop + 22, 11, 25);
    if (stage === 2) s += L(52, stemTop, 10, -45) + L(68, stemTop, 10, 45);
    if (stage >= 3) s += `<circle cx="60" cy="${stemTop - 6}" r="${stage === 4 ? 26 : 22}" fill="#9cbf76" stroke="#5b7342" stroke-width="1.5"/>` + L(44, stemTop + 26, 11, -25) + L(76, stemTop + 26, 11, 25);
    if (stage === 4) [[48, stemTop - 14, '#f4a3b5'], [70, stemTop - 16, '#f6c75b'], [60, stemTop + 2, '#f4a3b5'], [74, stemTop, '#fff'], [46, stemTop + 2, '#f6c75b']]
      .forEach(([x, y, c]) => s += `<circle cx="${x}" cy="${y}" r="4.5" fill="${c}" stroke="#c77" stroke-width=".8"/>`);
  }
  return `<svg class="plant" viewBox="0 0 120 124" width="${size}" aria-hidden="true">${s}</svg>`;
}
const STAGE_NAMES = ['씨앗', '새싹', '떡잎', '어린 나무', '꽃 핀 나무'];
const stageOf = n => n >= 20 ? 4 : n >= 14 ? 3 : n >= 7 ? 2 : n >= 1 ? 1 : 0;

/* ================= 진행 상태 ================= */
function progress(st) {
  const P = probs(st.grade), recs = st.recs || {};
  const certCount = P.filter((_, i) => recs[pid(st.grade, i)]?.cert).length;
  const doneCount = P.filter((_, i) => recs[pid(st.grade, i)]?.done).length;
  let next = P.findIndex((_, i) => !recs[pid(st.grade, i)]?.cert);
  const t = today();
  const todayCount = Object.values(recs).filter(r => r.date === t && r.grade === st.grade).length;
  const extra = st.extraDate === t ? (st.extra || 0) : 0;
  const locked = DB.daily && next >= 0 && todayCount >= 1 + extra;
  // 마무리 안 한 문제(인증만 하고 다시 살펴보기 안 함)
  const unfinished = P.findIndex((_, i) => recs[pid(st.grade, i)]?.cert && !recs[pid(st.grade, i)]?.done);
  // 연속 일수
  const days = new Set(Object.values(recs).filter(r => r.cert).map(r => r.date));
  let streak = 0; const d = new Date();
  if (!days.has(t)) d.setDate(d.getDate() - 1);
  for (;;) {
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    if (days.has(k)) { streak++; d.setDate(d.getDate() - 1); }
    else if (d.getDay() === 0 || d.getDay() === 6) { d.setDate(d.getDate() - 1); if (streak > 400) break; }
    else break;
    if (streak > 400) break;
  }
  const first = P.filter((_, i) => { const r = recs[pid(st.grade, i)]; return r?.cert && r.correct && r.tries === 1; }).length;
  const secs = Object.values(recs).reduce((a, r) => a + (r.secs || 0), 0);
  return { P, recs, certCount, doneCount, next, locked, unfinished, streak, first, secs };
}

const STEP_NAMES = ['문제 읽기', '혼자 생각', '식과 답', '풀이 인증', '모범 풀이', '다시 보기'];
const THINK_SEC = 15 * 60, HINT_SEC = 3 * 60;

function vSolve() {
  const st = student(); if (!st) return go('home');
  const g = st.grade, i = view.i, P = probs(g), pr = P[i], id = pid(g, i);
  if (!pr) return go('dash');
  st.drafts = st.drafts || {}; st.recs = st.recs || {};
  const rec = st.recs[id];
  // 열 수 있는지 확인
  const p = progress(st);
  if (!rec?.cert && (i !== p.next || p.locked)) { toast('아직 열리지 않은 문제예요.'); return go('dash'); }
  let d = st.drafts[id];
  if (!d) {
    d = st.drafts[id] = { step: 1, marks: {}, ask: '', eq: '', ans: pr.a.map(() => ''), tries: 0, hint: false, secs: 0, tpl: VIZ.template(pr), drawn: false, photo: false, start: today() };
    save();
  }
  if (rec?.cert && d.step < 5) d.step = 5;
  if (rec?.cert && !d.cert) d.cert = true;
  const key = `${st.id}/${id}`;

  // 타이머: 화면이 열려 있는 동안 생각한 시간 기록 (인증 전까지)
  let tick = null;
  if (!rec?.cert) {
    tick = setInterval(() => {
      if (document.hidden) return;
      d.secs++;
      if (d.secs % 10 === 0) save();
      const t = $('#tmr');
      if (t) {
        const left = Math.max(0, THINK_SEC - d.secs);

        t.querySelector('i').style.width = `${Math.min(100, d.secs / THINK_SEC * 100)}%`;
        const hb = $('#hintBtn');
        if (hb && !d.hint) {
          const wait = HINT_SEC - d.secs;
          hb.disabled = wait > 0;
          hb.textContent = wait > 0 ? `💡 힌트 (${Math.ceil(wait / 60)}분 뒤)` : '💡 힌트 보기';
        }
      }
    }, 1000);
  }
  let pad = null;
  cleanup = () => { clearInterval(tick); if (pad) pad.persist(); save(); };

  const head = () => `
    <div class="qhead"><button class="btn line sm" id="backDash">← 달력</button>

    <nav class="stepper">${STEP_NAMES.map((n, k) => {
      const s = k + 1, ok = s < d.step || (d.cert && s <= 4) || (rec?.done && s <= 6);

      return `<button data-step="${s}" class="${s === d.step ? 'on' : ''} ${ok && s !== d.step ? 'ok' : ''}" ${can ? '' : 'disabled'}><span class="dot">${ok && s !== d.step ? '✓' : s}</span>${n}</button>`;
    }).join('')}</nav>`;

  const probHTML = (interactive) => {
    const toks = pr.t.match(/\d+ \d+\/\d+|\S+/g);
    return `<div class="ptext">${toks.map((w, k) => `<span class="tok ${d.marks[k] || ''}" data-k="${k}">${frac(w)}</span>`).join(' ')}</div>`;

    const body = $('#stepBody');
    [, step1, step2, step3, step4, step5, step6][d.step](body);

  const nextStep = () => { d.step++; save(); draw(); window.scrollTo({ top: 0 }); };

  /* 1. 문제 읽기 */

      <div class="timer" id="tmr" style="margin-top:12px"><span>⏱</span><div class="bar"><i style="width:${Math.min(100, d.secs / THINK_SEC * 100)}%"></i></div><b>${left ? `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : '15분 ✔'}</b></div>

function modelParts(pr) {
  const num = n => `<span class="num">${n}</span>`;
  const parts = [];
  parts.push(`<div class="stp"><h3>${num(1)} 문제 이해하기</h3>
    <div><b class="small hl-g">알고 있는 것</b><ul>${pr.k.map(x => `<li>${frac(x)}</li>`).join('')}</ul>
    <b class="small hl-o">구하는 것</b><ul><li>${frac(pr.f)}</li></ul></div></div>`);
  pr.viz.forEach((v, k) => parts.push(`<div class="stp"><h3>${num(k + 2)} ${VIZ.name(v)}</h3>${v.cap ? `<div class="vcap">${esc(v.cap)}</div>` : ''}${VIZ.render(v)}</div>`));
  parts.push(`<div class="stp"><h3>${num(pr.viz.length + 2)} 식으로 해결하기</h3>
    <div class="eq">${pr.eq.map(frac).join('<br>')}</div>
    <div style="margin-top:8px"><span class="ans-badge">답 ${pr.a.map(([v, u]) => frac(String(v)) + esc(u)).join(' ')}</span></div>
    <div class="tip">${plant(1, 40)}<div class="hand">${frac(pr.tip)}</div></div></div>`);
  return parts;
}

/* ================= 그림판 ================= */
function makePad(el, key, d, onChange) {
  const bg = $('#bg', el), ink = $('#ink', el);
  const bc = bg.getContext('2d'), c = ink.getContext('2d');
  const W = 1000, H = 700;
  const P = { tool: 'pen', color: '#2f2a24', width: 4, drawn: !!d.drawn };
  const undo = [];
  let drawing = false, last = null, startPt = null, snap = null, dirtySave = null;
  drawTemplate(bc, d.tpl);
  IMG.get(key + '/ink').then(src => {
    if (!src) return;
    const im = new Image(); im.onload = () => c.drawImage(im, 0, 0, W, H); im.src = src;
  });
  const pt = e => { const r = ink.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  const style = () => {
    c.globalCompositeOperation = P.tool === 'erase' ? 'destination-out' : 'source-over';
    c.strokeStyle = P.color; c.lineWidth = P.tool === 'erase' ? 34 : P.width; c.lineCap = 'round'; c.lineJoin = 'round';
  };
  ink.addEventListener('pointerdown', e => {
    e.preventDefault(); ink.setPointerCapture(e.pointerId);
    undo.push(c.getImageData(0, 0, W, H)); if (undo.length > 25) undo.shift();
    drawing = true; last = startPt = pt(e); style();
    if (P.tool === 'line' || P.tool === 'rect') snap = c.getImageData(0, 0, W, H);
    else { c.beginPath(); c.arc(last.x, last.y, c.lineWidth / 2, 0, 7); c.fillStyle = P.color; if (P.tool !== 'erase') c.fill(); else { c.fill(); } }
  });
  ink.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pt(e);
    if (P.tool === 'line' || P.tool === 'rect') {
      c.putImageData(snap, 0, 0); style(); c.beginPath();
      if (P.tool === 'line') {
        let { x, y } = p;
        if (Math.abs(y - startPt.y) < 18) y = startPt.y; // 거의 수평이면 수평으로
        if (Math.abs(x - startPt.x) < 18) x = startPt.x;
        c.moveTo(startPt.x, startPt.y); c.lineTo(x, y);
      } else c.rect(startPt.x, startPt.y, p.x - startPt.x, p.y - startPt.y);
      c.stroke();
    } else {
      c.beginPath(); c.moveTo(last.x, last.y); c.lineTo(p.x, p.y); c.stroke(); last = p;
    }
  });
  const end = () => {
    if (!drawing) return; drawing = false; snap = null;
    if (P.tool !== 'erase') { P.drawn = true; d.drawn = true; }
    clearTimeout(dirtySave); dirtySave = setTimeout(() => P.persist(), 800);
    onChange();
  };
  ink.addEventListener('pointerup', end); ink.addEventListener('pointercancel', end);
  P.undo = () => { const im = undo.pop(); if (im) { c.putImageData(im, 0, 0); P.persist(); } };
  P.clear = () => { undo.push(c.getImageData(0, 0, W, H)); c.clearRect(0, 0, W, H); P.drawn = false; d.drawn = false; P.persist(); onChange(); };
  P.bg = tpl => drawTemplate(bc, tpl);
  P.persist = () => { clearTimeout(dirtySave); return IMG.set(key + '/ink', ink.toDataURL('image/png')); };
  return P;
}
function drawTemplate(ctx, tpl) {
  const W = 1000, H = 700;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#cfd8c2'; ctx.fillStyle = '#b7c2a8'; ctx.lineWidth = 2; ctx.font = '22px sans-serif';
  if (tpl === 'grid') {
    ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  } else if (tpl === 'line') {
    for (const y of [330, 580]) {
      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(50, y); ctx.lineTo(950, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(950, y); ctx.lineTo(934, y - 9); ctx.lineTo(934, y + 9); ctx.closePath(); ctx.fill();
      ctx.lineWidth = 2;

function wrap(ctx, text, maxW) {
  const lines = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      const t = line ? line + ' ' + word : word;
      if (ctx.measureText(t).width <= maxW) { line = t; continue; }
      if (line) lines.push(line);
      if (ctx.measureText(word).width <= maxW) { line = word; continue; }
      line = '';
      for (const ch of word) { if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; } else line += ch; }
    }
    lines.push(line);
  }
  return lines;
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
async function makeCard(st, pr, i, r) {

  try { await Promise.all([document.fonts.load('30px "Gowun Dodum"', allText), document.fonts.load('30px Jua', allText), document.fonts.load('bold 30px Gaegu', '정답을 보기 전에, 내 생각이 먼저 남았어요.')]); } catch (e) { }
  const key = `${st.id}/${pid(st.grade, i)}`;

  cv.width = W; cv.height = H;

  y += 36;

  ctx.fillStyle = '#2f2a24'; ctx.font = `30px ${body}`;
  pLines.forEach((l, k) => ctx.fillText(l, PAD + 20, y + 52 + k * 46));
  y += pLines.length * 46 + 40 + 60;
  ctx.fillStyle = '#d9774a'; ctx.font = `28px ${head}`; ctx.fillText('구하는 것', PAD, y);
  ctx.fillStyle = '#2f2a24'; ctx.font = `30px ${body}`; ctx.fillText(r.ask, PAD + 140, y);
  y += 40;
  if (im) {
    ctx.save(); rr(ctx, PAD, y, IW, imH, 20); ctx.clip(); ctx.fillStyle = '#fff'; ctx.fillRect(PAD, y, IW, imH);
    const s = Math.min(IW / im.width, imH / im.height); const dw = im.width * s, dh = im.height * s;

  ctx.fillStyle = '#2f2a24'; ctx.font = `30px ${body}`;
  eqLines.forEach((l, k) => ctx.fillText(l, PAD + 60, y + k * 44));
  y += eqLines.length * 44 + 30;
  ctx.fillStyle = '#5b7342'; ctx.font = `30px ${head}`; ctx.fillText('답', PAD, y + 34);
  const ansText = pr.a.map(([, u], k) => `${r.ans[k]}${u}`).join(' ');

  ctx.fillStyle = '#2f2a24'; ctx.fillText(ansText, PAD + 85, y + 36);
  const badge = r.correct ? (r.tries === 1 ? '한 번에 해결 ✔' : '다시 생각해서 해결 ✔') : '생각 과정 인증 🌱';
  ctx.font = `28px ${head}`; const bw = ctx.measureText(badge).width + 40;
  ctx.fillStyle = r.correct ? '#e8efdc' : '#fbe7dc'; rr(ctx, W - PAD - bw, y - 6, bw, 56, 28); ctx.fill();

  y += 110;
  ctx.fillStyle = '#7d7266'; ctx.font = `24px ${body}`;
  ctx.fillText(`생각한 시간 ${Math.max(1, Math.round(r.secs / 60))}분${r.hint ? ' · 힌트 사용' : ''}`, PAD, y);
  ctx.fillStyle = '#5b7342'; ctx.font = `bold 32px Gaegu, cursive`; ctx.textAlign = 'right';
  ctx.fillText('정답을 보기 전에, 내 생각이 먼저 남았어요.', W - PAD, y); ctx.textAlign = 'left';

}
function wireCard(root, url, name) {

    const list = probs(g).map((pr, i) => ({ pr, i })).filter(x => !w || weekOf(x.i) === w);
    $('#printArea').innerHTML = list.map(({ pr, i }) => `<div class="psheet">
      <div style="display:flex;justify-content:space-between"><b>시각화 챌린지 · 초${g} · Day ${i + 1}</b><span>이름: ________ 날짜: ____</span></div>
      <div class="pprob">${frac(pr.t)}</div>
      <div>구하는 것: <span class="pline" style="display:inline-block;width:70%"></span></div>
      <div class="pbox"><span>그림 · 수직선 · 막대 · 표로 나타내기</span></div>
      <div>식</div><div class="pline"></div><div class="pline"></div>
      <div style="margin-top:8px">답: ________ ${esc(pr.a.map(a => a[1]).join(' '))}</div>
      <div style="margin-top:8px">모범 풀이와 비교해서 알게 된 점</div><div class="pline"></div></div>
      ${key ? `<div class="psheet model"><b>Day ${i + 1} 모범 풀이</b>${modelParts(pr).join('')}</div>` : ''}`).join('');
    window.print();
  };
}
function tSettings(tb) {
  tb.innerHTML = `<div class="card">
    <h3 style="margin:0 0 8px">학습 규칙</h3>
    <label class="row"><input type="checkbox" id="daily" style="width:auto" ${DB.daily ? 'checked' : ''}> 하루에 한 문제만 열기 (끄면 이어서 계속 풀 수 있어요)</label>
    <h3 style="margin:18px 0 8px">학원 이름 (완주 카드에 표시)</h3>
    <input id="acad" maxlength="20" value="${esc(DB.academy)}">
    <h3 style="margin:18px 0 8px">비밀번호 바꾸기</h3>
    <div class="row"><input id="np" type="password" inputmode="numeric" maxlength="8" placeholder="새 비밀번호 (4자리 이상)" style="max-width:240px"><button class="btn ghost sm" id="setPin">바꾸기</button></div>
    <h3 style="margin:18px 0 8px">백업</h3>
    <p class="small muted" style="margin:0 0 8px">기기를 바꾸거나 브라우저 기록을 지우기 전에 백업 파일을 저장해 두세요. (그림 포함)</p>
    <div class="row"><button class="btn ghost sm" id="exp">⬇️ 백업 저장</button><label class="btn ghost sm" style="cursor:pointer">⬆️ 백업 불러오기<input type="file" id="imp" accept="application/json,.json" hidden></label></div>
  </div>`;
  $('#daily').onchange = e => { DB.daily = e.target.checked; save(); toast('저장했어요.'); };
  $('#acad').onchange = e => { DB.academy = e.target.value.trim() || DEFAULTS.academy; save(); toast('저장했어요.'); };
  $('#setPin').onclick = () => { const v = $('#np').value.trim(); if (v.length < 4) return toast('4자리 이상으로 정해 주세요.'); DB.pin = v; save(); $('#np').value = ''; toast('비밀번호를 바꿨어요.'); };
  $('#exp').onclick = async () => {
    const imgs = {}; for (const k of (await IMG.keys()) || []) imgs[k] = await IMG.get(k);
    const blob = new Blob([JSON.stringify({ v: 1, db: DB, imgs })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `시각화챌린지_백업_${today()}.json`; a.click();
  };
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data.db || !Array.isArray(data.db.students)) throw 0;
      if (!confirm('백업을 불러오면 지금 기록이 백업 내용으로 바뀌어요. 계속할까요?')) return;
      DB = Object.assign({}, DEFAULTS, data.db); save();
      for (const [k, v] of Object.entries(data.imgs || {})) await IMG.set(k, v);
      toast('백업을 불러왔어요.'); go('teacher', { tab: 'students' });
    } catch (err) { toast('백업 파일을 읽지 못했어요.'); }
  };
}

go(student() ? 'dash' : 'home');
</script>
</body>
