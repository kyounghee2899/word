<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4b5bd6">
<meta name="description" content="하루 10분, 처리속도·작업기억·실행기능을 키우는 적응형 두뇌 루틴 (초등)">
<title>브레인 루틴</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="브레인 루틴">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4fb; --card:#ffffff; --ink:#22243a; --muted:#6b6f88; --line:#e3e5f2; --soft:#eef0fb;
  --pri:#4b5bd6; --pri-ink:#fff; --pri-soft:#e6e9ff;
  --ps:#e8743b; --ps-soft:#fdeadf; --wm:#2f8fd8; --wm-soft:#e0f0fc; --ef:#8a4fd1; --ef-soft:#efe5fb;
  --ok:#1f9d55; --bad:#e0352b; --warn:#b86e00;
  --shadow:0 1px 0 rgba(30,35,90,.04),0 8px 24px rgba(30,35,90,.07);
  --stage:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15172a; --card:#1f2238; --ink:#eef0ff; --muted:#a3a7c6; --line:#30344f; --soft:#272b45;
    --pri:#8391ff; --pri-ink:#11132a; --pri-soft:#2b3060;
    --ps:#ff9a61; --ps-soft:#3d2a20; --wm:#5fb4f5; --wm-soft:#1d3247; --ef:#b98bf2; --ef-soft:#33264a;
    --ok:#3fcb7c; --bad:#ff6b61; --warn:#f0b04a; --shadow:none; --stage:#1f2238;
  }
}
:root[data-theme="dark"]{
  --bg:#15172a; --card:#1f2238; --ink:#eef0ff; --muted:#a3a7c6; --line:#30344f; --soft:#272b45;
  --pri:#8391ff; --pri-ink:#11132a; --pri-soft:#2b3060;
  --ps:#ff9a61; --ps-soft:#3d2a20; --wm:#5fb4f5; --wm-soft:#1d3247; --ef:#b98bf2; --ef-soft:#33264a;
  --ok:#3fcb7c; --bad:#ff6b61; --warn:#f0b04a; --shadow:none; --stage:#1f2238;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Gowun Dodum',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
h1,h2,h3,.jua,button,.btn{font-family:'Jua',system-ui,sans-serif;font-weight:400}
h1{font-size:26px;margin:0;line-height:1.25}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:13.5px} .center{text-align:center}
.page{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.row.between{justify-content:space-between} .row.end{justify-content:flex-end} .row.wrap{justify-content:flex-start}
.col{display:flex;flex-direction:column;gap:12px;align-items:stretch;margin-top:16px}
.btn{border:0;background:var(--pri);color:var(--pri-ink);font-size:18px;padding:12px 22px;border-radius:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:12px}
.btn.big{font-size:21px;padding:15px 26px;border-radius:18px}
.btn.wide{width:100%}
.icon-btn{border:0;background:var(--soft);color:var(--ink);width:42px;height:42px;border-radius:14px;font-size:20px;cursor:pointer;flex:none}
.inp{font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.inp:focus{outline:2px solid var(--pri);border-color:transparent}
.inp.sm{padding:6px 8px;font-size:15px;width:auto}
.form{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;align-items:center;gap:6px;font-size:15.5px}
.chk input{width:20px;height:20px;accent-color:var(--pri)}
.warn{color:var(--warn);text-align:center}
.install{display:flex;align-items:center;gap:12px;background:var(--pri-soft);border:0}
.install img{width:48px;height:48px;border-radius:12px;flex:none}
.install div{flex:1;min-width:0}
.install b{font-family:'Jua';font-weight:400;font-size:17px;display:block}
.install small{color:var(--muted);font-size:13px}

/* 탭 */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;max-width:120px;border:0;background:none;color:var(--muted);font-size:13px;padding:4px 0;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button span{font-size:21px;line-height:1.2;filter:grayscale(.7);opacity:.75}
.tabs button.on{color:var(--pri);background:var(--pri-soft)}
.tabs button.on span{filter:none;opacity:1}

/* 머리 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:6px 2px}
.hero{text-align:center;padding:28px 0 6px}
.hero .logo{font-size:64px;line-height:1}
.hero h1{font-size:34px;color:var(--pri);margin-top:6px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.mini b{font-family:'Jua';font-weight:400;font-size:17px}
.mini.ps{background:var(--ps-soft)} .mini.ps b{color:var(--ps)}
.mini.wm{background:var(--wm-soft)} .mini.wm b{color:var(--wm)}
.mini.ef{background:var(--ef-soft)} .mini.ef b{color:var(--ef)}
@media (max-width:480px){.three{grid-template-columns:1fr}}

.who{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;scrollbar-width:none}
.who-chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;padding:7px 14px;border-radius:999px;cursor:pointer}
.who-chip.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.who-chip.add{border-style:dashed;color:var(--muted)}

/* 오늘 */
.today-head{display:flex;gap:18px;align-items:center}
.ring{--p:0deg;width:112px;height:112px;border-radius:50%;flex:none;background:conic-gradient(var(--pri) var(--p),var(--soft) 0);display:grid;place-items:center}
.ring>div{width:86px;height:86px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:'Jua';font-weight:400;font-size:28px;line-height:1}
.ring small{color:var(--muted);font-size:12.5px}
.today-info{flex:1;min-width:0}
.today-info .btn{margin-top:8px}
.streak{font-family:'Jua';font-size:18px}
.streak b{font-weight:400;color:var(--ps);font-size:22px}
.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--soft);cursor:pointer;border:2px solid transparent;transition:transform .08s}
.step:active{transform:scale(.99)}
.step.next{border-color:var(--pri);background:var(--pri-soft)}
.step.done{opacity:.62}
.step-n{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:'Jua';flex:none;border:1.5px solid var(--line)}
.step.done .step-n{background:var(--ok);color:#fff;border-color:var(--ok)}
.step-ic{font-size:28px;flex:none}
.step-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.step-tx b{font-family:'Jua';font-weight:400;font-size:18px}
.step-tx small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.step-side small{color:var(--muted);font-size:12.5px}
.dchip{display:inline-block;font-family:'Jua';font-size:13px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.dchip.ps{background:var(--ps-soft);color:var(--ps)} .dchip.wm{background:var(--wm-soft);color:var(--wm)} .dchip.ef{background:var(--ef-soft);color:var(--ef)}
.lvchip{display:inline-block;font-family:'Jua';font-size:13px;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12.5px}
.wd.today{color:var(--pri);font-weight:bold}
.dot{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:17px;color:#fff}
.dot.full{background:var(--pri)} .dot.half{background:var(--pri-soft);color:var(--pri);font-size:28px;line-height:0}
.doms{display:flex;flex-direction:column;gap:14px}
.dom-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dom-h b{font-family:'Jua';font-weight:400;font-size:20px}
.lvbar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.lvbar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.lvbar i.ps{background:var(--ps)} .lvbar i.wm{background:var(--wm)} .lvbar i.ef{background:var(--ef)}

/* 설명 */
.back{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:6px 0}
.intro-hero,.res-hero{text-align:center;padding:22px 16px;border-radius:26px;margin-top:6px}
.intro-hero.ps,.res-hero.ps{background:var(--ps-soft)} .intro-hero.wm,.res-hero.wm{background:var(--wm-soft)} .intro-hero.ef,.res-hero.ef{background:var(--ef-soft)}
.big-ic{font-size:60px;line-height:1.1}
.intro-hero h1{font-size:30px;margin:6px 0 10px}
.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:17px}
.how b{color:var(--pri)}
.tip{background:var(--pri-soft);border-color:transparent}
.tip b{font-family:'Jua';font-weight:400;color:var(--pri)}
.sticky-go{position:sticky;bottom:14px;margin-top:18px}

/* 활동 화면 */
.play{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.play-top{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;max-width:760px;width:100%;margin:0 auto}
.play-title{flex:1;display:flex;flex-direction:column;line-height:1.2}
.play-title b{font-family:'Jua';font-weight:400;font-size:19px}
.play-title small{color:var(--muted)}
.hud-s{font-family:'Jua';font-size:20px;min-width:60px;text-align:right}
.hud{position:relative;height:22px;margin:0 auto 6px;max-width:732px;width:calc(100% - 28px);background:var(--soft);border-radius:99px;overflow:hidden}
.hud i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:99px;transition:width .12s linear}
.play.ps .hud i{background:var(--ps)} .play.wm .hud i{background:var(--wm)} .play.ef .hud i{background:var(--ef)}
.hud-l{position:absolute;inset:0;display:grid;place-items:center;font-family:'Jua';font-size:13.5px;color:var(--ink);mix-blend-mode:normal}
.stage{position:relative;flex:1;min-height:0;max-width:760px;width:100%;margin:0 auto;padding:10px 14px 16px;display:flex;flex-direction:column;border-radius:24px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage.fb-ok{animation:fbok .35s}
.stage.fb-bad{animation:fbbad .4s}
.stage.fb-miss{animation:fbmiss .4s}
@keyframes fbok{0%{box-shadow:inset 0 0 0 4px var(--ok)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes fbbad{0%{box-shadow:inset 0 0 0 6px var(--bad)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}100%{box-shadow:inset 0 0 0 0 transparent;transform:none}}
@keyframes fbmiss{0%{box-shadow:inset 0 0 0 5px var(--warn)}100%{box-shadow:inset 0 0 0 0 transparent}}
.overlay{position:fixed;inset:0;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);z-index:30;backdrop-filter:blur(3px)}
.overlay.on{display:grid}
.count{font-family:'Jua';font-size:120px;color:var(--pri);animation:pop .6s}
@keyframes pop{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
.ov-box{background:var(--card);border-radius:26px;padding:26px 30px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:6px;animation:pop .4s;max-width:86vw}
.ov-box b{font-family:'Jua';font-weight:400;font-size:30px;color:var(--pri)}
.flash-msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);font-family:'Jua';font-size:22px;padding:10px 20px;border-radius:16px;pointer-events:none;z-index:5;animation:pop .3s}

.g-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%}
.g-col.fill{justify-content:flex-start}
.g-col:not(.fill)>:first-child{margin-top:auto}
.g-label{font-family:'Jua';color:var(--muted);font-size:15px;margin-bottom:-8px}
.sym{display:inline-flex;color:var(--ink)}
.ans2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px;margin-top:auto}
.ans{border:0;border-radius:22px;font-size:26px;padding:22px 8px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:manipulation}
.ans small{font-size:12px;opacity:.75;font-family:'Gowun Dodum'}
.ans.yes{background:var(--ok)} .ans.no{background:#6b6f88}
.ans:active,.pad-btn:active,.st-btn:active,.sw-btn:active{transform:scale(.96)}
/* 기호 찾기 */
.ss-targets{display:flex;gap:14px;padding:14px 22px;border-radius:20px;background:var(--pri-soft);border:2px solid var(--pri)}
.ss-group{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:14px;border-radius:20px;background:var(--card);border:2px solid var(--line);max-width:100%}
/* 기호 암호 */
.cd-key{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:8px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.cd-key.pulse{animation:keyp 1s 2}
@keyframes keyp{50%{border-color:var(--ps);background:var(--ps-soft)}}
.cd-cell{display:flex;flex-direction:column;align-items:center;padding:4px 6px;border-radius:10px;min-width:42px}
.cd-cell b{font-family:'Jua';font-weight:400;font-size:19px;border-top:1.5px solid var(--line);width:100%;text-align:center;margin-top:2px}
.cd-stim{padding:16px 26px;border-radius:24px;background:var(--card);border:3px solid var(--ps);min-height:120px;display:grid;place-items:center}
.cd-pad{display:grid;gap:8px;width:100%;max-width:520px;margin-top:auto}
.pad-btn{border:0;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;font-size:26px;padding:14px 0;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 0 var(--line)}
.pad-btn.ghost{font-size:17px;background:var(--soft)}
/* 비교 */
.cmp-box{display:flex;flex-direction:column;gap:8px;padding:18px 18px;border-radius:22px;background:var(--card);border:2px solid var(--line);width:100%;max-width:520px;align-items:center}
.cmp-line{font-family:'Gowun Dodum',monospace;font-weight:bold;font-size:clamp(28px,8.5vw,46px);letter-spacing:.14em;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp-line+.cmp-line{border-top:2px dashed var(--line);padding-top:6px;width:100%;text-align:center}
.cmp-line:first-child{width:100%;text-align:center}
/* 작업기억 */
.wm-mode{font-family:'Jua';font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.tag{font-weight:400;padding:3px 10px;border-radius:999px;color:#fff}
.tag.f{background:var(--wm)} .tag.b{background:var(--ef)}
.play.ps .tag.f{background:var(--ps)}
.ds-disp{width:170px;height:170px;border-radius:32px;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-family:'Jua';font-size:96px;color:var(--wm);text-align:center;line-height:1.1}
.ds-disp.show{border-color:var(--wm);animation:pop .25s}
.ds-disp.ask{font-size:22px;color:var(--muted);padding:10px}
.ds-disp .small{font-size:22px;color:var(--bad)}
.ds-slots{display:flex;gap:6px;min-height:50px;flex-wrap:wrap;justify-content:center}
.slot{width:40px;height:48px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-family:'Jua';font-size:26px}
.slot.on{border-style:solid;border-color:var(--wm);background:var(--wm-soft)}
.num-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px;margin-top:auto}
.num-pad .ghost{grid-column:1/-1}
.num-pad.off,.grid-board.off{pointer-events:none;opacity:.45}
.grid-board{display:grid;gap:10px;width:min(88vw,360px,52vh);aspect-ratio:1}
.cell{border:0;border-radius:16px;background:var(--card);border:2px solid var(--line);cursor:pointer;font-family:'Jua';font-size:24px;color:#fff;transition:background .12s;touch-action:manipulation}
.cell.lit{background:#ffc531;border-color:#f0a400;box-shadow:0 0 24px #ffc531}
.cell.hit{background:var(--wm);border-color:var(--wm)}
.cell.miss{background:var(--bad);border-color:var(--bad)}
.cell.show{background:color-mix(in srgb,var(--wm) 45%,transparent);border-color:var(--wm)}
.grid-msg{font-family:'Jua';font-size:18px;color:var(--muted);min-height:28px}
.grid-board.off{opacity:1}
.nb-frame,.gng-frame{width:min(60vw,220px);height:min(60vw,220px);border-radius:32px;background:var(--card);border:3px solid var(--line);display:grid;place-items:center}
.big-tap{width:100%;max-width:520px;margin-top:auto;border:0;border-radius:26px;font-size:30px;padding:26px 0;background:var(--wm);color:#fff;cursor:pointer;touch-action:manipulation;transition:transform .06s}
.big-tap.go{background:var(--ef)}
.big-tap.pressed{transform:scale(.96);filter:brightness(1.1)}
.gng-stop{display:inline-flex;vertical-align:middle}
/* 스트룹 — 색을 정확히 보이려고 카드만 밝은 바탕 */
.st-card{width:100%;max-width:460px;border-radius:26px;background:#f7f7f9;border:3px solid #d9dbe6;padding:14px 10px 22px;display:flex;flex-direction:column;align-items:center;gap:4px}
.st-card.word{border:3px dashed #e9b100;background:#fffbea}
.st-cue{font-family:'Jua';font-size:17px;color:#6b6f88}
.st-card.word .st-cue{color:#a06d00;font-size:19px}
.st-word{font-family:'Jua';font-size:clamp(60px,18vw,92px);line-height:1.1;-webkit-text-stroke:1px rgba(0,0,0,.18)}
.st-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:460px;margin-top:auto}
.st-btn{--c:#000;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;font-size:22px;padding:14px 8px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:manipulation}
.st-btn i{width:28px;height:28px;border-radius:50%;background:var(--c);flex:none}
.st-btn small{font-size:12px;color:var(--muted);font-family:'Gowun Dodum'}
/* 규칙 바꾸기 */
.sw-card{width:100%;max-width:420px;border-radius:26px;border:4px solid;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card)}
.sw-card.color{border-color:#d6336c}
.sw-card.shape{border-color:#0b9aa8}
.sw-cue{font-family:'Jua';font-size:24px;padding:4px 16px;border-radius:999px;color:#fff}
.sw-card.color .sw-cue{background:#d6336c}
.sw-card.shape .sw-cue{background:#0b9aa8}
.sw-stim{height:120px;display:grid;place-items:center}
.sw-btn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;touch-action:manipulation}
.sw-btn small{font-size:14px;color:var(--muted)}
/* 순서 잇기 */
.tr-field{position:relative;flex:1;width:100%;min-height:300px;border-radius:22px;background:var(--card);border:2px solid var(--line);overflow:hidden}
.tr-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tr-lines line{stroke:var(--ef);stroke-width:3;stroke-linecap:round;opacity:.65}
.tr-node{position:absolute;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);color:var(--ink);font-family:'Jua';font-size:19px;display:grid;place-items:center;padding:0;cursor:pointer;touch-action:manipulation;z-index:1}
.tr-node.kor{border-color:var(--ef);color:var(--ef)}
.tr-node.start{box-shadow:0 0 0 4px var(--pri-soft)}
.tr-node.done{background:var(--ef);border-color:var(--ef);color:#fff}
.tr-node.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* 하노이 */
.hn-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:620px;height:min(46vh,300px)}
.hn-peg{position:relative;border:2px solid var(--line);background:var(--card);border-radius:18px;cursor:pointer;padding:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;touch-action:manipulation}
.hn-peg.sel{border-color:var(--ef);background:var(--ef-soft)}
.hn-peg.shake{animation:shake .35s}
.hn-pole{position:absolute;bottom:10px;top:22px;left:50%;width:8px;margin-left:-4px;border-radius:4px;background:var(--line)}
.hn-goal{position:absolute;top:2px;font-style:normal;font-family:'Jua';font-size:13px;color:var(--ef)}
.hn-stack{position:relative;width:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding-bottom:10px}
.hn-disk{height:22px;border-radius:11px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);transition:transform .12s}
.hn-disk.up{transform:translateY(-26px)}

/* 결과 */
.res-score{font-family:'Jua';font-size:40px;line-height:1.2;margin-top:4px}
.res-sub{color:var(--muted);margin-top:2px}
.res-hero h2{margin:2px 0}
.lvup,.lvdn,.lvsame{text-align:center;font-family:'Jua';font-size:20px;margin:14px 0 0;padding:10px;border-radius:16px}
.lvup{background:#fff3c4;color:#8a5a00}
.lvdn{background:var(--soft);color:var(--muted)}
.lvsame{color:var(--muted)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lvup{background:#4a3c10;color:#ffd666}}
.stats{display:flex;justify-content:space-around;text-align:center;gap:8px}
.stats div{display:flex;flex-direction:column}
.stats small{color:var(--muted);font-size:13px}
.stats b{font-family:'Jua';font-weight:400;font-size:24px}
.stamp{margin:20px auto 8px;width:190px;height:190px;border-radius:50%;border:5px double var(--ps);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ps);transform:rotate(-6deg);animation:pop .6s;background:var(--ps-soft)}
.stamp div{font-size:56px;line-height:1}
.stamp b{font-family:'Jua';font-weight:400;font-size:22px}
.card .done-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.done-list li{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--soft)}
.done-list li span{flex:1}
.done-list .up{color:var(--ok);font-style:normal}
.moods{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.mood{flex:1;min-width:100px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 6px;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.mood span{font-size:30px}
.mood.on{border-color:var(--pri);background:var(--pri-soft)}
.small-h{font-size:16px;margin:16px 0 6px}

/* 자유 연습 */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.game-card{border:2px solid transparent;border-radius:18px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;color:var(--ink)}
.game-card.ps{background:var(--ps-soft)} .game-card.wm{background:var(--wm-soft)} .game-card.ef{background:var(--ef-soft)}
.game-card.dim{opacity:.55}
.gc-ic{font-size:34px}
.game-card b{font-weight:400;font-size:17px}
.game-card small{font-family:'Gowun Dodum';color:var(--muted);font-size:12.5px;line-height:1.35}

/* 기록 */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:'Jua';font-size:19px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-w{text-align:center;font-size:12.5px;color:var(--muted)}
.cal-c{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:14px;background:var(--soft);color:var(--muted)}
.cal-c.empty{background:none}
.cal-c.full{background:var(--pri);color:var(--pri-ink);font-weight:bold}
.cal-c.half{background:var(--pri-soft);color:var(--pri)}
.cal-c.today{outline:2px solid var(--pri);outline-offset:1px}
.glist{display:flex;flex-direction:column}
.grow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.grow:last-child{border:0}
.gr-n{flex:1;min-width:0}
.gr-v{font-family:'Jua';min-width:84px;text-align:right}
.gr-v small{color:var(--muted);font-family:'Gowun Dodum'}
.spark{display:inline-flex;width:120px;justify-content:center}
.spark.ps{color:var(--ps)} .spark.wm{color:var(--wm)} .spark.ef{color:var(--ef)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{font-family:'Jua';font-weight:400;color:var(--muted);text-align:left;padding:6px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num{font-family:'Jua';font-size:17px}
.up{color:var(--ok)} .dn{color:var(--bad)}

/* 선생님 */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:24px;padding:20px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
.modal .row.end{margin-top:16px}
.report{white-space:pre-wrap;font-family:'Gowun Dodum';font-size:14px;background:var(--soft);padding:14px;border-radius:14px;margin:0 0 8px;line-height:1.6}
.chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lv-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lv-grid label{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14.5px;background:var(--soft);padding:4px 4px 4px 10px;border-radius:12px}
@media (max-width:480px){.chk-grid,.lv-grid{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;opacity:0;transition:.25s;z-index:60;font-family:'Jua';max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 안내 */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
.flow-s{background:var(--soft);border-radius:14px;padding:10px 6px;text-align:center;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.flow-s b{font-family:'Jua';font-weight:400;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center}
@media (max-width:480px){.flow{grid-template-columns:1fr 1fr}}
.gd-wrap{display:grid;gap:10px}
.gd{border-radius:16px;padding:12px 14px}
.gd.ps{background:var(--ps-soft)} .gd.wm{background:var(--wm-soft)} .gd.ef{background:var(--ef-soft)}
.gd h3{margin:0}
.gd.ps h3{color:var(--ps)} .gd.wm h3{color:var(--wm)} .gd.ef h3{color:var(--ef)}
.gd ul{margin:6px 0 0;padding-left:18px}
.warnbox{border:2px solid var(--warn)}
.card ul,.card ol{padding-left:22px;margin:6px 0}
.card li{margin:4px 0}
/* 태블릿·PC: 자극을 크게 */
@media (min-width:700px) and (min-height:760px){
  .ss-targets svg{width:84px;height:84px} .ss-group svg{width:68px;height:68px}
  .ss-targets,.ss-group{padding:18px 26px;gap:16px}
  .cd-cell svg{width:50px;height:50px} .cd-cell{min-width:62px} .cd-cell b{font-size:24px}
  .cd-stim svg{width:130px;height:130px}
  .cmp-box{max-width:640px} .cmp-line{font-size:60px}
  .ds-disp{width:240px;height:240px;font-size:140px}
  .slot{width:52px;height:60px;font-size:32px}
  .num-pad{max-width:460px} .pad-btn{font-size:32px;padding:18px 0}
  .grid-board{width:min(480px,50vh)}
  .nb-frame,.gng-frame{width:300px;height:300px} .nb-frame svg,.gng-frame svg{width:180px;height:180px}
  .st-card{max-width:620px} .st-word{font-size:128px} .st-btns{max-width:620px} .st-btn{font-size:26px;padding:20px 8px}
  .sw-card{max-width:560px} .sw-stim{height:170px} .sw-stim svg{width:160px;height:160px} .sw-cue{font-size:30px}
  .sw-btn svg{width:74px;height:74px}
  .ans2,.cd-pad,.big-tap{max-width:640px} .ans{font-size:32px;padding:28px 8px}
  .hn-board{height:min(50vh,440px);max-width:720px} .hn-disk{height:30px;border-radius:15px} .hn-disk.up{transform:translateY(-34px)}
  .wm-mode{font-size:22px}
}
@media (max-height:640px){.ds-disp{width:130px;height:130px;font-size:72px}.pad-btn{padding:10px 0}.big-tap{padding:18px 0}.ans{padding:16px 8px}}
</style>
</head>
